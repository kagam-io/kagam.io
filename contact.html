<body data-page="contact">
<canvas id="c"></canvas>
<nav class="nav" aria-label="メニュー"></nav>

<main class="window">
<div class="window-body" data-scroll>
  <h1>Contact</h1>
  <p class="lead">連絡はこちらから</p>

  <section>
    <h2>メッセージを送る</h2>
    <form class="form" id="contact-form" novalidate>
      <div class="field">
        <label for="f-name">お名前<span class="opt">任意</span></label>
        <input id="f-name" name="name" type="text" maxlength="60" autocomplete="name">
      </div>
      <div class="field">
        <label for="f-email">返信先のメールアドレス<span class="opt">任意</span></label>
        <input id="f-email" name="email" type="email" maxlength="120" autocomplete="email" inputmode="email">
      </div>
      <div class="field">
        <label for="f-message">内容</label>
        <textarea id="f-message" name="message" maxlength="3000" required></textarea>
      </div>
      <div class="trap" aria-hidden="true">
        <!-- ロボットだけが埋めるわなの欄。自動入力が反応しないよう、ありふれた名前 (website など) にしない -->
        <label for="f-leave-empty">この欄は空のままにしてください</label>
        <input id="f-leave-empty" name="leave_empty" type="text" tabindex="-1" autocomplete="off">
      </div>
      <!--
        Turnstile の部品。data-sitekey は Cloudflare の画面で発行した「サイトキー」。
        サイトキーは HTML で誰にでも見える値なので、公開してよい (秘密のキーは TURNSTILE_SECRET)。
        interaction-only: ふだんは見えず、確認が必要なときだけ表示される
      -->
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAGA3yu02D2LirGVR" data-theme="dark" data-appearance="interaction-only" data-size="flexible"></div>
      <div class="form-foot">
        <button class="send" type="submit">送信</button>
        <p class="form-status" id="form-status" role="status"></p>
      </div>
      <p class="form-note">送っていただいた内容は、返信のためだけに使います。</p>
    </form>
    <div class="thanks" id="thanks" hidden>
      <p>送信しました。ありがとうございます。</p>
    </div>
  </section>

  <section class="others">
    <h2>ほかの連絡先</h2>
  <dl class="contacts">
    <div class="contact">
      <dt>X</dt>
      <dd><a class="ext" href="https://x.com/kagam_10" target="_blank" rel="noopener">@kagam_10</a></dd>
    </div>
    <div class="contact">
      <dt>GitHub</dt>
      <dd><a class="ext" href="https://github.com/kagam-io" target="_blank" rel="noopener">kagam-io</a></dd>
    </div>
    <div class="contact">
      <dt>Zenn</dt>
      <dd><a class="ext" href="https://zenn.dev/kagam_io" target="_blank" rel="noopener">kagam_io</a></dd>
    </div>
  </dl>
  </section>
</div>
